# Apache VirtualHost for the store (XAMPP: C:\xampp\apache\conf\extra\httpd-vhosts.conf)
# Serves Laravel's public folder (which also contains the built React app) on port 80.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs/E-commerce-store/backend/public"

    <Directory "C:/xampp/htdocs/E-commerce-store/backend/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/store-error.log"
    CustomLog "logs/store-access.log" common
</VirtualHost>
